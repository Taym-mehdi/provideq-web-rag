[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provideq-web-rag"
version = "0.2.0"
description = "Scientific-paper retrieval and evidence extraction for ProvideQ"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
claude = ["claude-agent-sdk>=0.1.60"]

[project.scripts]
provideq-web-rag = "web_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
